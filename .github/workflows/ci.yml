name: Go verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 third_party/cometbft/overlay.py
      - run: go test ./...
      - run: go test -race -tags=comet_v3 ./...
      - run: go vet -tags=comet_v3 ./...
      - run: go build -tags=comet_v3 ./...
